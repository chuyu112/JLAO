server {
    listen 80 default_server;
    server_name 47.120.41.143;

    location / {
        return 301 https://jlao.szkakayiduo.com$request_uri;
    }
}

server {
    listen 80;
    server_name jlao.szkakayiduo.com JLAO.szkakayiduo.com;

    root /var/www/jlao;

    location /.well-known/acme-challenge/ {
        root /var/www/jlao;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name jlao.szkakayiduo.com JLAO.szkakayiduo.com;

    root /var/www/jlao;
    index index.html;

    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/jlao.szkakayiduo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jlao.szkakayiduo.com/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8001/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
